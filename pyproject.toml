[build-system]
requires = ["setuptools==75.8.2", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-research"
version = "0.1.0"
description = "Auditable offline A-share research MVP"
requires-python = ">=3.9,<3.13"
dependencies = ["numpy==1.26.4", "pandas==2.2.3", "scipy==1.13.1"]

[project.scripts]
quant-research = "quant_research.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
